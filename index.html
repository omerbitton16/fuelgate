<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FuelGate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1B2C7E;--brand-700:#142160;--brand-soft:#EBEEF9;
  --accent:#16A34A;--accent-soft:#E6F6EC;
  --bg:#F4F6FA;--card:#fff;--ink:#0E1633;--ink-2:#344054;--muted:#667085;--line:#E7EAF1;
  --ok:#16A34A;--ok-soft:#E6F6EC;
  --warn-bg:#FFF6D1;--warn-line:#F2C230;--warn-ink:#7A5B00;
  --bad:#DC2626;--bad-bg:#FFE6E6;--bad-line:#F5A3A3;--bad-ink:#8F1D1D;
  --soon:#C2410C;--soon-soft:#FFEEDD;
  --r-sm:10px;--r:16px;--r-lg:22px;
  --sh-sm:0 1px 2px rgba(16,24,40,.06);
  --sh:0 1px 3px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --sh-lg:0 30px 70px rgba(16,24,40,.18);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
a{color:var(--brand);cursor:pointer;font-weight:600;text-decoration:none}
a:hover{text-decoration:underline}
h2,h3{margin:0 0 8px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.center{text-align:center}
.mono{font-family:Consolas,"SF Mono",monospace;letter-spacing:.5px}
.hidden{display:none!important}
svg{flex:none}

/* ===== Header ===== */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 24px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);display:grid;place-items:center;color:#fff;position:relative;box-shadow:0 6px 16px rgba(27,44,126,.28)}
.wordtext{direction:ltr;unicode-bidi:isolate;font-weight:800;letter-spacing:-.02em;color:var(--brand)}
.wordtext span{color:var(--accent)}
.wordtext.lg{font-size:30px;line-height:1.1;margin-bottom:4px}
.proto{display:inline-block;background:var(--accent-soft);color:#166534;border-radius:6px;padding:0 6px;font-size:11px;font-weight:600;margin-inline-start:4px}
.brand h1{font-size:17px;margin:0;font-weight:700}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.tabs-wrap{flex:1;display:flex;justify-content:center;min-width:0}
.tabs{display:flex;gap:2px;background:#EDF0F6;padding:4px;border-radius:14px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tab{border:none;background:transparent;color:var(--muted);padding:8px 14px;border-radius:10px;display:flex;align-items:center;gap:7px;font-weight:500;white-space:nowrap;transition:background .2s var(--ease),color .2s}
.tab:hover{color:var(--ink)}
.tab.active{background:#fff;color:var(--brand);box-shadow:var(--sh-sm);font-weight:600}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11.5px;display:inline-grid;place-items:center;font-weight:700}
.tools{display:flex;gap:8px}
.ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2);border-radius:10px;padding:7px 12px;display:flex;align-items:center;gap:6px;font-size:13.5px;transition:background .15s}
.ghost:hover{background:#F8FAFC}

main{max-width:1320px;margin:0 auto;padding:28px 24px 56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.section-title h2{margin:0;font-size:20px;display:flex;align-items:center;gap:8px}
.count{background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}

/* ===== Buttons & fields ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:11px 18px;background:var(--brand);color:#fff;font-weight:600;transition:transform .12s var(--ease),background .15s,box-shadow .15s;box-shadow:0 1px 2px rgba(27,44,126,.25)}
.btn:hover{background:var(--brand-700)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh-sm)}
.btn.sec:hover{background:#F8FAFC}
.btn.ok{background:var(--accent);box-shadow:0 1px 2px rgba(22,163,74,.3)}
.btn.ok:hover{background:#12873D}
.btn.bad{background:#fff;color:var(--bad);border:1px solid var(--bad-line);box-shadow:none}
.btn.bad:hover{background:var(--bad-bg)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
label{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin:14px 0 6px}
.field{width:100%;padding:11px 14px;border:1px solid #D6DBE6;border-radius:12px;background:#fff;color:var(--ink);font-size:15px;transition:border-color .15s,box-shadow .15s}
.field:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(27,44,126,.12)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* ===== Pills & dots ===== */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:#166534}
.pill.bad{background:#FEE2E2;color:var(--bad-ink)}
.pill.wait{background:#FEF3C7;color:#92400E}
.pill.soon{background:var(--soon-soft);color:var(--soon)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid #98A2B3;margin-inline-end:7px;flex:none;vertical-align:-1px}
.dot.white{background:#fff;border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.dot.yellow{background:#FACC15;border-color:#CA8A04;box-shadow:0 0 0 3px #FEF3C7}
.dot.red{background:#EF4444;border-color:#B91C1C;box-shadow:0 0 0 3px #FEE2E2}

/* ===== Driver app ===== */
.driver-wrap{display:grid;grid-template-columns:400px 1fr;gap:32px;align-items:start}
.phone{width:400px;height:820px;background:#0E1633;border-radius:52px;padding:12px;box-shadow:var(--sh-lg);position:sticky;top:96px}
.screen{background:var(--bg);border-radius:42px;height:100%;overflow:hidden;display:flex;flex-direction:column}
.app-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:22px 20px 14px;background:#fff;border-bottom:1px solid var(--line)}
.app-head .link{background:none;border:none;color:var(--brand);padding:6px;display:flex;align-items:center;gap:2px;font-weight:600;border-radius:8px}
.app-head .link:hover{background:var(--brand-soft)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700}
.hello{display:flex;align-items:center;gap:10px}
.screen-body{flex:1;overflow:auto;padding:18px 18px 24px}
.bnav{display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:8px 8px 16px}
.bnav button{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;padding:6px 16px;border-radius:12px;transition:color .15s,background .15s}
.bnav button.active{color:var(--brand);background:var(--brand-soft);font-weight:600}

.status-card{background:#fff;border:1px solid var(--line);border-inline-start:6px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh-sm);margin-bottom:12px}
.status-card.white{border-inline-start-color:var(--ok)}
.status-card.yellow{background:var(--warn-bg);border-color:var(--warn-line)}
.status-card.red{background:var(--bad-bg);border-color:var(--bad-line);border-inline-start-color:var(--bad)}
.status-card .st{display:flex;align-items:center;font-weight:700;font-size:17px}
.status-card ul{margin:6px 0 0;padding-inline-start:18px;font-size:13px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:11px 12px;font-size:13px;margin-bottom:10px}
.alert.soon{background:var(--soon-soft);color:#7C2D12}
.alert.bad{background:#FEE2E2;color:var(--bad-ink)}
.alert .grow{flex:1}

.big-wrap{display:grid;place-items:center;padding:22px 0 6px}
.big-btn{position:relative;width:184px;height:184px;border-radius:50%;border:none;background:linear-gradient(160deg,#3248B8 0%,var(--brand) 55%,var(--brand-700) 100%);color:#fff;font-size:28px;font-weight:800;display:grid;place-items:center;box-shadow:0 20px 44px rgba(27,44,126,.38),inset 0 2px 0 rgba(255,255,255,.15);transition:transform .15s var(--ease)}
.big-btn::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid var(--accent);animation:breathe 2.8s var(--ease) infinite;pointer-events:none}
.big-btn small{display:block;font-size:13px;font-weight:400;opacity:.85}
.big-btn:hover{transform:translateY(-2px)}
.big-btn:active{transform:scale(.97)}
@keyframes breathe{0%{transform:scale(.92);opacity:.7}70%{transform:scale(1.1);opacity:0}100%{opacity:0}}
.where{display:flex;justify-content:center;margin-top:10px}
.where span{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink-2)}

.summary{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:18px;box-shadow:var(--sh-sm);cursor:pointer;transition:border-color .15s}
.summary:hover{border-color:#C9D1E3}
.cert-item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh-sm)}
.cert-item .ci{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.cert-item .grow{flex:1;min-width:0}
.cert-item b{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}
.qr-box{background:#fff;border-radius:24px;padding:18px;display:inline-block;border:1px solid var(--line);box-shadow:var(--sh);margin:14px 0}
#qr{display:block;transition:opacity .25s}
.ring{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.result{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 6px;text-align:center}
.result .icon{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;color:#fff;animation:pop .45s var(--ease)}
.result .icon.ok{background:var(--accent);box-shadow:0 0 0 12px var(--ok-soft)}
.result .icon.bad{background:var(--bad);box-shadow:0 0 0 12px #FEE2E2}
.result .icon.warn{background:#EAB308;box-shadow:0 0 0 12px #FEF3C7}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.preview{width:100%;max-height:170px;object-fit:contain;border:1px dashed #CBD2E0;border-radius:12px;margin-top:10px;background:#fff}
.login-hero{text-align:center;padding:26px 0 8px}
.login-hero .logo{width:64px;height:64px;border-radius:20px;margin:0 auto 14px}
.profile{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-sm)}
.profile div{display:flex;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);font-size:14px}
.profile div:first-child{border-top:none}

.monitor h3{font-size:16px;display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(22,163,74,.5);animation:live 1.8s infinite}
@keyframes live{70%{box-shadow:0 0 0 8px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.hint{background:linear-gradient(180deg,#F5F7FD,#EEF2FB);border:1px solid #DDE3F3;color:var(--ink-2);border-radius:var(--r);padding:16px 18px;font-size:13.5px;margin-top:18px}
.hint ol{margin:8px 0 0;padding-inline-start:18px}
.hint li{margin-bottom:4px}

/* ===== Scan banner & log ===== */
.banner{background:#fff;border:1px solid var(--line);border-inline-start:6px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh-sm)}
.banner.fresh{animation:slideIn .5s var(--ease)}
@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}}
.banner.idle{color:var(--muted);text-align:center;border-style:dashed;border-inline-start-width:1px;padding:28px;box-shadow:none;background:#FAFBFD}
.banner.white{border-inline-start-color:var(--ok)}
.banner.yellow{background:var(--warn-bg);border-color:var(--warn-line)}
.banner.red{background:var(--bad-bg);border-color:var(--bad-line);border-inline-start-color:var(--bad)}
.b-top{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.b-top .muted{margin-inline-start:auto;font-size:12px}
.b-title{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.01em}
.banner.white .b-title{color:var(--ok)}
.banner.red .b-title{color:var(--bad)}
.banner.yellow .b-title{color:var(--warn-ink)}
.b-reason{font-size:14px;margin-top:4px}
.b-where{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:2px 10px;margin-top:6px}
.b-beep{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:8px}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;align-items:center;gap:4px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.log li:first-child{border-top:none}
.log li .t{margin-inline-start:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.tag{font-size:11px;background:#F1F3F8;color:var(--muted);border-radius:6px;padding:1px 6px;margin-inline-start:4px}

/* ===== Guard ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh-sm)}
.stat .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.stat .ic.ok{background:var(--ok-soft);color:var(--ok)}
.stat .ic.warn{background:#FEF3C7;color:#A16207}
.stat .ic.bad{background:#FEE2E2;color:var(--bad)}
.stat .n{font-size:28px;font-weight:800;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}
.guard-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search-wrap{position:relative;flex:1;min-width:240px}
.search-wrap svg{position:absolute;top:50%;right:14px;transform:translateY(-50%);color:var(--muted)}
.search{width:100%;padding:13px 44px 13px 14px;border:1px solid #D6DBE6;border-radius:14px;font-size:16px;background:#fff;box-shadow:var(--sh-sm);transition:border-color .15s,box-shadow .15s}
.search:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(27,44,126,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;display:flex;align-items:center;color:var(--ink-2);transition:all .15s}
.chip:hover{border-color:#C9D1E3}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.guard-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;min-width:900px}
th{background:#F8FAFC;color:var(--muted);text-align:right;padding:12px;font-weight:600;font-size:12.5px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:13px 12px;border-top:1px solid var(--line);font-size:14px;vertical-align:top}
tbody tr:first-child td{border-top:none}
tr.row{cursor:pointer}
tr.row td{transition:background .15s}
tr.row.white td{background:#fff}
tr.row.yellow td{background:var(--warn-bg)}
tr.row.red td{background:var(--bad-bg)}
tr.row.white td:first-child{box-shadow:inset -4px 0 0 var(--ok)}
tr.row.yellow td:first-child{box-shadow:inset -4px 0 0 var(--warn-line)}
tr.row.red td:first-child{box-shadow:inset -4px 0 0 var(--bad)}
tr.row.white:hover td{background:#F8FAFC}
tr.row.yellow:hover td{background:#FFF0B3}
tr.row.red:hover td{background:#FFD6D6}
td.name b{display:block}
.st-cell{display:flex;align-items:center;font-weight:600;white-space:nowrap}
.missing{color:var(--bad-ink);font-size:13px}
.empty{padding:36px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:10px}

/* ===== Modal ===== */
.modal{position:fixed;inset:0;background:rgba(14,22,51,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px}
.modal-box{background:#fff;border-radius:var(--r-lg);width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:24px;box-shadow:var(--sh-lg);animation:pop .3s var(--ease)}
.modal-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.modal-head > div{flex:1}
.x{background:#F1F3F8;border:none;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2)}
.x:hover{background:#E6E9F1}
.status-tag{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;border:1.5px solid}
.status-tag.white{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.status-tag.yellow{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.status-tag.red{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad-ink)}
.cert-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cert-card{border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:13px;background:#FCFCFE}
.cert-card img{width:100%;border-radius:10px;border:1px solid var(--line);margin-top:10px;background:#fafafa;cursor:zoom-in;transition:transform .2s var(--ease)}
.cert-card img:hover{transform:scale(1.02)}
.cert-card .noimg{height:96px;border:1px dashed #CBD2E0;border-radius:10px;margin-top:10px;display:grid;place-items:center;color:var(--muted)}
.issue-box{display:flex;gap:10px;background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad-ink);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:14px}
.issue-box ul{margin:4px 0 0;padding-inline-start:18px}
.issue-box.yellow{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}

/* ===== Manager / Admin ===== */
.queue{display:grid;gap:14px}
.q-item{display:grid;grid-template-columns:220px 1fr;gap:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.q-item img{width:100%;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.simple-table{min-width:0}
.reg-card{margin-bottom:12px}
.reg-card .hello{margin-bottom:12px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:60;box-shadow:var(--sh-lg);max-width:calc(100% - 32px);display:flex;align-items:center;gap:10px;animation:slideUp .35s var(--ease)}
.toast svg{color:#4ADE80}
@keyframes slideUp{from{opacity:0;transform:translate(-50%,12px)}}

@media (max-width:1100px){
  .guard-grid{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
}
@media (max-width:960px){
  .driver-wrap{grid-template-columns:1fr}
  .phone{position:static;width:100%;max-width:440px;height:auto;margin:0 auto;padding:0;background:none;box-shadow:none;border-radius:0}

<script>
/* ---------- Icons ---------- */
const I = {

  pin:'<path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  height:'<path d="M12 3v18"/><path d="m8 7 4-4 4 4"/><path d="m8 17 4 4 4-4"/>',
  flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 1.5 1 3 2.5 3-3z"/>',
};
const icon = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ---------- Helpers ---------- */
const DAY = 86400000;
const today = new Date(); today.setHours(0,0,0,0);
const iso = x => x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const d = n => iso(new Date(today.getTime()+n*DAY));
const fmt = s => { const [y,m,dd] = s.split('-'); return `${dd}/${m}/${y}`; };
const daysTo = s => Math.round((new Date(s+'T00:00:00') - today)/DAY);
const time = t => new Date(t).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const initials = name => name.split(' ').map(w => w[0]).slice(0,2).join('');

const CERTS = { security:'אישור ביטחוני', height:'עבודה בגובה', hazmat:'הובלת חומ"ס' };
const CERT_ICON = { security:'shield', height:'height', hazmat:'flame' };
const UPLOADABLE = ['height','hazmat'];
const COLOR_WORD = { white:'לבן', yellow:'צהוב', red:'אדום' };
/* ---------- Branding: the only place to change when adapting to a real company ---------- */
const BRAND = {
  name: ['Fuel', 'Gate'],           // wordmark: first part in brand color, second in accent
  tagline: 'שער דיגיטלי למסופי דלק',
  terminal: 'מסוף 1',               // terminal of this gate station; drivers can pass through several terminals a day
};
const TERMINAL = BRAND.terminal;
const brandWord = () => `${esc(BRAND.name[0])}<span>${esc(BRAND.name[1])}</span>`;
const brandMark = (s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5c3.2 4.2 6.5 7.8 6.5 11.5a6.5 6.5 0 0 1-13 0c0-3.7 3.3-7.3 6.5-11.5z" fill="#fff"/><path d="m9 14.2 2.2 2.2 4-4.4" stroke="#16A34A" stroke-width="2.4"/></svg>`;

/* ---------- Demo data ---------- */
function seed(){
  const V = (n,num) => ({status:'valid', expiry:d(n), number:num, img:null, pending:null});
  const M = () => ({status:'missing', expiry:null, number:null, img:null, pending:null});
  const ago = m => new Date(Date.now() - m*60000);
  const drivers = [
    {id:1,name:'יוסי כהן',tz:'300000011',company:'הובלות הצפון',phone:'050-1111111',user:'yossi',approved:true,inside:false,last:null,notes:[],
     certs:{security:V(210,'SEC-4471'),height:V(95,'H-2290'),hazmat:V(160,'HZ-8812')}},
    {id:2,name:'דני לוי',tz:'300000029',company:'דלק-טרנס',phone:'050-2222222',user:'dani',approved:true,inside:false,last:ago(48),notes:[],
     certs:{security:V(300,'SEC-1180'),height:V(-10,'H-1022'),hazmat:V(120,'HZ-3301')}},
    {id:3,name:'מוחמד חטיב',tz:'300000037',company:'הובלות הגליל',phone:'050-3333333',user:'mohamad',approved:true,inside:false,last:null,notes:[],
     certs:{security:V(250,'SEC-7781'),height:V(200,'H-5521'),hazmat:V(12,'HZ-7720')}},
    {id:4,name:'אבי מזרחי',tz:'300000045',company:'מכליות המרכז',phone:'050-4444444',user:'avi',approved:true,inside:false,last:null,notes:[],
     certs:{security:M(),height:V(180,'H-6610'),hazmat:V(90,'HZ-1209')}},
    {id:5,name:'רונן פרץ',tz:'300000052',company:'הובלות הדרום',phone:'050-5555555',user:'ronen',approved:false,inside:false,last:null,notes:[],
     certs:{security:M(),height:M(),hazmat:M()}},
    {id:6,name:'שלומי ביטון',tz:'300000060',company:'הובלות הצפון',phone:'050-6666666',user:'shlomi',approved:true,inside:true,last:ago(95),notes:[],
     certs:{security:V(330,'SEC-3320'),height:V(240,'H-8890'),hazmat:V(280,'HZ-4456')}},
    {id:7,name:'איגור פטרוב',tz:'300000078',company:'דלק-טרנס',phone:'050-7777777',user:'igor',approved:true,inside:false,last:null,notes:[],
     certs:{security:V(150,'SEC-9902'),height:V(140,'H-3378'),
            hazmat:{...M(), pending:{expiry:d(365),number:'HZ-9051',img:null,at:ago(30)}}}},
    {id:8,name:'משה אוחיון',tz:'300000086',company:'מכליות המרכז',phone:'050-8888888',user:'moshe',approved:true,inside:false,last:null,notes:[],
     certs:{security:V(190,'SEC-5567'),height:V(25,'H-4401'),hazmat:V(220,'HZ-6634')}},
  ];
  const log = [
    {t:ago(48),id:2,name:'דני לוי',color:'red',ok:false,action:'נדחה',method:'QR',terminal:TERMINAL,reason:'עבודה בגובה — פג תוקף ('+fmt(d(-10))+')'},
    {t:ago(95),id:6,name:'שלומי ביטון',color:'white',ok:true,action:'כניסה',method:'QR',terminal:TERMINAL},
  ];
  return {drivers, log, lastScan:null, nextId:9};
}

let state = seed();
let ui;
function resetUi(){ ui = {tab:'driver', dview:'login', currentId:null, filter:'all', q:'', sound: ui ? ui.sound : true, qr:null, result:null, uploadKey:'height', uploadImg:null}; }
resetUi();

const byId = id => state.drivers.find(x => x.id === id);
const cur = () => byId(ui.currentId);

/* ---------- Status engine ---------- */
function evalD(dr){
  const issues = [], warnings = [];
  for (const k of Object.keys(CERTS)){
    const c = dr.certs[k];
    if (c.status !== 'valid'){
      issues.push({k, label:CERTS[k], text: c.pending ? 'ממתין לאישור מנהל המסוף' : 'חסר'});
    } else {
      const n = daysTo(c.expiry);
      if (n < 0) issues.push({k, label:CERTS[k], text:'פג תוקף ('+fmt(c.expiry)+')' + (c.pending ? ' — חידוש ממתין לאישור' : '')});
      else if (n <= 30) warnings.push({k, label:CERTS[k], days:n, expiry:c.expiry});
    }
  }
  const color = !dr.approved ? 'yellow' : issues.length ? 'red' : 'white';
  return {color, issues, warnings};
}
function certPill(c){
  if (c.status !== 'valid') return c.pending ? '<span class="pill wait">ממתין לאישור</span>' : '<span class="pill bad">חסר</span>';
  const n = daysTo(c.expiry);
  if (c.pending) return '<span class="pill wait">חידוש ממתין</span>';
  if (n < 0) return '<span class="pill bad">פג תוקף</span>';
  if (n <= 30) return '<span class="pill soon">פוקע בקרוב</span>';
  return '<span class="pill ok">תקין</span>';
}
function expText(c){
  if (c.status !== 'valid') return c.pending ? 'הועלה מסמך — ממתין לבדיקה' : 'אין אישור במערכת';
  const n = daysTo(c.expiry);
  if (n < 0) return 'פג ב-' + fmt(c.expiry);
  return 'בתוקף עד ' + fmt(c.expiry) + (n <= 30 ? ` · עוד ${n} ימים` : '');
}

/* ---------- Sound (white = continuous beep, else 3 short beeps) ---------- */
let ac;
function tone(t, dur, f){
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'square'; o.frequency.value = f;
  g.gain.setValueAtTime(0.06, t); g.gain.setValueAtTime(0, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function beep(ok){
  if (!ui.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + 0.02;
    if (ok) tone(t, 0.9, 1000);
    else [0, 0.22, 0.44].forEach(o => tone(t + o, 0.12, 1400));
  } catch(e){}
}

/* ---------- Gate actions ---------- */
function scan(id, method){
  const dr = byId(id), ev = evalD(dr);
  let e;
  if (ev.color === 'white'){
    dr.inside = !dr.inside;
    e = {ok:true, color:'white', action: dr.inside ? 'כניסה' : 'יציאה'};
  } else {
    e = {ok:false, color:ev.color, action:'נדחה',
         reason: ev.color === 'yellow' ? 'הנהג לא רשום / ממתין לאישור רישום' : ev.issues.map(i => i.label + ' — ' + i.text).join(' · ')};
  }
  Object.assign(e, {t:new Date(), id:dr.id, name:dr.name, method, terminal:TERMINAL});
  dr.last = e.t;
  state.log.unshift(e); state.lastScan = e;
  beep(e.ok);
  return e;
}
function scanUnknown(){
  const e = {t:new Date(), id:null, name:'קוד לא מזוהה', color:'yellow', ok:false, action:'נדחה', method:'QR', terminal:TERMINAL, reason:'הקוד לא קיים במערכת — יש לבדוק ת"ז ידנית'};
  state.log.unshift(e); state.lastScan = e; beep(false);
}

/* ---------- Placeholder certificate image ---------- */
function certImg(dr, k, c){
  if (c && c.img) return c.img;
  const num = esc((c && c.number) || '—'), exp = c && c.expiry ? fmt(c.expiry) : '—';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="210" viewBox="0 0 320 210">
  <rect width="320" height="210" rx="12" fill="#FCFCFE" stroke="#D6DBE6"/>
  <rect x="0" y="0" width="320" height="8" rx="4" fill="#1B2C7E"/>
  <text x="22" y="34" font-family="Arial" font-size="13" font-weight="700" fill="#1B2C7E">${esc(BRAND.name[0].toUpperCase())}<tspan fill="#16A34A">${esc(BRAND.name[1].toUpperCase())}</tspan></text>
  <text x="298" y="46" font-family="Arial" font-size="19" font-weight="700" text-anchor="end" fill="#0E1633">תעודת ${esc(CERTS[k])}</text>
  <text x="298" y="82" font-family="Arial" font-size="14" text-anchor="end" fill="#344054">שם: ${esc(dr.name)}</text>
  <text x="298" y="106" font-family="Arial" font-size="14" text-anchor="end" fill="#344054">ת.ז: ${esc(dr.tz)}</text>
  <text x="298" y="130" font-family="Arial" font-size="14" text-anchor="end" fill="#344054">מס׳ אישור: ${num}</text>
  <text x="298" y="154" font-family="Arial" font-size="14" text-anchor="end" fill="#344054">בתוקף עד: ${exp}</text>
  <circle cx="64" cy="140" r="34" fill="none" stroke="#16A34A" stroke-width="3" opacity=".8"/>
  <text x="64" y="145" font-family="Arial" font-size="13" text-anchor="middle" fill="#16A34A">חותמת</text>
  <text x="160" y="198" font-family="Arial" font-size="10" text-anchor="middle" fill="#98A2B3">מסמך דוגמה פיקטיבי</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ---------- Pseudo QR (visual only) ---------- */
function newQr(){
  const token = Math.random().toString(16).slice(2,10).toUpperCase();
  ui.qr = {token, seed: Math.floor(Math.random()*1e9), exp: Date.now() + 30000};
}
function drawQr(){
  const cv = $('qr'); if (!cv || !ui.qr) return;
  const n = 25, s = cv.width / n, ctx = cv.getContext('2d');
  let x = ui.qr.seed;
  const rnd = () => (x = (x * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.width);
  const inFinder = (r,c) => (r < 8 && c < 8) || (r < 8 && c >= n-8) || (r >= n-8 && c < 8);
  ctx.fillStyle = '#0E1633';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (!inFinder(r,c) && rnd() < 0.47) ctx.fillRect(c*s, r*s, s, s);
  [[0,0],[0,n-7],[n-7,0]].forEach(([r,c]) => {
    ctx.fillStyle = '#1B2C7E'; ctx.fillRect(c*s, r*s, 7*s, 7*s);
    ctx.fillStyle = '#fff';    ctx.fillRect((c+1)*s, (r+1)*s, 5*s, 5*s);
    ctx.fillStyle = '#16A34A'; ctx.fillRect((c+2)*s, (r+2)*s, 3*s, 3*s);
  });
}
setInterval(() => {
  if (ui.tab !== 'driver' || ui.dview !== 'qr' || !ui.qr) return;
  let left = Math.ceil((ui.qr.exp - Date.now()) / 1000);
  if (left <= 0){
    newQr(); left = 30;
    const cv = $('qr');
    if (cv){ cv.style.opacity = 0; setTimeout(() => { drawQr(); cv.style.opacity = 1; }, 220); }
    const tk = $('qrToken'); if (tk) tk.textContent = ui.qr.token;
  }
  const el = $('qrCount'); if (el) el.textContent = left;
}, 250);

/* ---------- Shared pieces ---------- */
function bannerHtml(e){
  if (!e) return `<div class="banner idle">${icon('scan',22)}<div style="margin-top:6px">ממתין לסריקה בשער…</div></div>`;
  const title = e.ok ? `${e.action} מאושרת` : (e.color === 'yellow' ? 'לא רשום במערכת' : 'כניסה נחסמה');
  const fresh = Date.now() - new Date(e.t).getTime() < 1500 ? 'fresh' : '';
  return `<div class="banner ${e.color} ${fresh}">
    <div class="b-top"><span class="dot ${e.color}"></span><b>${esc(e.name)}</b><span class="muted">${time(e.t)} · ${esc(e.method)}</span></div>
    <div class="b-where">${icon('pin',14)}${esc(e.terminal)}</div>
    <div class="b-title">${title}</div>
    ${e.reason ? `<div class="b-reason">${esc(e.reason)}</div>` : ''}
    <div class="b-beep">${icon('sound',14)}${e.ok ? 'ביפ רצוף' : '3 ביפים קצרים'}</div>
  </div>`;
}
function logHtml(limit){
  const items = state.log.slice(0, limit);
  if (!items.length) return '<p class="muted small">אין אירועים עדיין.</p>';
  return '<ul class="log">' + items.map(e => `<li><span class="dot ${e.color}"></span><span><b>${esc(e.name)}</b> · ${esc(e.action)}<span class="tag">${esc(e.method)}</span><div class="small muted">${icon('pin',12)} ${esc(e.terminal)}</div></span><span class="t">${time(e.t)}</span></li>`).join('') + '</ul>';
}
function toast(msg){
  const t = $('toast'); t.innerHTML = icon('check',18) + '<span>' + esc(msg) + '</span>';
  t.classList.remove('hidden'); t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
  clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.add('hidden'), 2600);
}
function openModal(html){ $('modalBox').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal(){ $('modal').classList.add('hidden'); $('modalBox').innerHTML = ''; }

/* ---------- Tabs ---------- */
function pendingDocs(){
  const items = [];
  state.drivers.forEach(dr => Object.keys(CERTS).forEach(k => { const p = dr.certs[k].pending; if (p) items.push({dr, k, p}); }));
  return items;
}
function renderTabs(){
  const docs = pendingDocs().length, regs = state.drivers.filter(x => !x.approved).length;
  const TABS = [['driver','אפליקציית נהג','phone',0],['guard','עמדת מאבטח','shield',0],['manager','מנהל מסוף','doc',docs],['admin','מנהל מערכת','users',regs]];
  $('tabs').innerHTML = TABS.map(([k,l,ic,b]) => `<button class="tab ${ui.tab===k?'active':''}" data-act="tab" data-k="${k}">${icon(ic,16)}${l}${b?`<span class="badge">${b}</span>`:''}</button>`).join('');
}

/* ---------- Driver app ---------- */
const head = (title, backTo) => `<div class="app-head">${backTo ? `<button class="link" data-act="${backTo}">${icon('back',18)}חזרה</button>` : '<span style="width:60px"></span>'}<b>${title}</b><span style="width:60px"></span></div>`;
const bnav = active => `<nav class="bnav">${[['home','בית','home'],['certs','אישורים','doc'],['profile','פרופיל','user']].map(([k,l,ic]) => `<button class="${active===k?'active':''}" data-act="nav" data-k="${k}">${icon(ic,20)}${l}</button>`).join('')}</nav>`;

function phoneScreen(){
  if (ui.dview !== 'login' && ui.dview !== 'register' && !cur()) ui.dview = 'login';
  const dr = cur();
  switch (ui.dview){
    case 'login': {

/* ---------- Guard station ---------- */
function filteredDrivers(){
  const q = ui.q.trim().toLowerCase();
  return state.drivers.filter(dr => {
    const c = evalD(dr).color;
    if (ui.filter === 'inside' && !dr.inside) return false;
    if (['white','yellow','red'].includes(ui.filter) && c !== ui.filter) return false;
    if (!q) return true;
    return [dr.name, dr.tz, dr.company, dr.user].some(v => String(v).toLowerCase().includes(q));
  });
}
function guardRows(){
  const list = filteredDrivers();
  if (!list.length) return `<tr><td colspan="8" class="empty">לא נמצא נהג. אפשר להוסיף נהג חדש מהכפתור למעלה.</td></tr>`;
  const order = {red:0, yellow:1, white:2};
  return list.slice().sort((a,b) => order[evalD(a).color] - order[evalD(b).color]).map(dr => {
    const ev = evalD(dr);
    const missing = ev.color === 'yellow' ? '<span class="missing">לא רשום / ממתין לאישור רישום</span>'
      : ev.issues.length ? '<span class="missing">' + ev.issues.map(i => esc(i.label) + ': ' + esc(i.text)).join('<br>') + '</span>' : '<span class="muted">—</span>';
    const valid = Object.values(dr.certs).filter(c => c.status === 'valid' && daysTo(c.expiry) >= 0);
    let nearest = '<span class="muted">—</span>';
    if (valid.length && dr.approved){
      const c = valid.reduce((a,b) => daysTo(a.expiry) <= daysTo(b.expiry) ? a : b);
      nearest = fmt(c.expiry) + (daysTo(c.expiry) <= 30 ? ' <span class="pill soon">פוקע בקרוב</span>' : '');
    }
    return `<tr class="row ${ev.color}" data-act="open-driver" data-id="${dr.id}">
      <td><span class="st-cell"><span class="dot ${ev.color}"></span>${{white:'תקין',yellow:'לא רשום',red:'חסר'}[ev.color]}</span></td>
      <td class="name"><b>${esc(dr.name)}</b><span class="small muted">${esc(dr.phone)}</span></td>
      <td class="mono">${esc(dr.tz)}</td>
      <td>${esc(dr.company)}</td>
      <td>${missing}</td>
      <td>${nearest}</td>
      <td>${dr.inside ? '<span class="pill ok">בפנים</span>' : '<span class="muted">בחוץ</span>'}</td>
      <td>${dr.last ? time(dr.last) : '<span class="muted">—</span>'}</td>
    </tr>`;
  }).join('');
}

  const soon = [];
  state.drivers.forEach(dr => Object.keys(CERTS).forEach(k => {
    const c = dr.certs[k];
    if (c.status === 'valid' && daysTo(c.expiry) <= 30) soon.push({dr, k, c, n: daysTo(c.expiry)});
  }));
  soon.sort((a,b) => a.n - b.n);
  const soonRows = soon.length ? soon.map(s => `<tr><td><b>${esc(s.dr.name)}</b></td><td>${CERTS[s.k]}</td><td>${fmt(s.c.expiry)}</td><td>${s.n < 0 ? '<span class="pill bad">פג</span>' : `<span class="pill soon">${s.n} ימים</span>`}</td></tr>`).join('')
    : '<tr><td colspan="4" class="empty">אין אישורים שפוקעים בקרוב.</td></tr>';

  return `<div class="two-col">
    <section>
      <div class="section-title"><h2>${icon('doc',22)}מסמכים לאישור</h2><span class="count">${items.length} ממתינים</span></div>
      <div class="queue">${queue}</div>
    </section>
    <section>
      <div class="section-title"><h2>${icon('clock',22)}פוקעים / פגו ב-30 יום</h2></div>
      <div class="table-wrap"><table class="simple-table"><thead><tr><th>נהג</th><th>אישור</th><th>תאריך</th><th>מצב</th></tr></thead><tbody>${soonRows}</tbody></table></div>
      <p class="note">הנהג מקבל תזכורת אוטומטית באפליקציה 30 יום לפני פקיעה, כדי לקבוע הדרכה לפני שהוא נחסם בשער.</p>
    </section>
  </div>`;
}

/* ---------- System admin ---------- */
function renderAdmin(){
  const regs = state.drivers.filter(x => !x.approved);
  const regHtml = regs.length ? regs.map(dr => `
    <div class="card reg-card">
      <div class="hello"><div class="avatar">${esc(initials(dr.name))}</div><div><b>${esc(dr.name)}</b><div class="small muted">${esc(dr.company)}</div></div></div>
      <div class="kv"><span>ת״ז</span><span class="mono">${esc(dr.tz)}</span><span>טלפון</span><span>${esc(dr.phone)}</span></div>
      <div class="row-actions"><button class="btn ok sm" data-act="approve-reg" data-id="${dr.id}">${icon('check',16)}אשר רישום</button><button class="btn bad sm" data-act="reject-reg" data-id="${dr.id}">${icon('x',16)}דחה</button></div>
    </div>`).join('') : `<div class="card empty">${icon('inbox',28)}<div style="margin-top:8px">אין בקשות רישום ממתינות.</div></div>`;
  const secRows = state.drivers.filter(x => x.approved).map(dr => {
    const c = dr.certs.security;
    return `<tr><td><b>${esc(dr.name)}</b><div class="small muted">${esc(dr.company)}</div></td><td>${certPill(c)}</td><td>${c.status==='valid' ? fmt(c.expiry) : '<span class="muted">—</span>'}</td>
      <td><div style="display:flex;gap:6px;flex-wrap:wrap"><input id="sec-${dr.id}" class="field" type="date" value="${d(365)}" style="width:155px;padding:7px 10px"><button class="btn sm" data-act="grant-sec" data-id="${dr.id}">${c.status==='valid' ? 'חדש' : 'הענק'}</button></div></td></tr>`;
  }).join('');
  return `<div class="two-col">
    <section>
      <div class="section-title"><h2>${icon('users',22)}בקשות רישום</h2><span class="count">${regs.length} ממתינות</span></div>
      ${regHtml}
      <p class="note">היום רק אדם אחד יכול לרשום נהג. כאן כל מי שמוגדר כמנהל מערכת יכול לאשר, וזה מבטל את צוואר הבקבוק.</p>
    </section>
    <section>
      <div class="section-title"><h2>${icon('shield',22)}אישורים ביטחוניים</h2></div>
      <div class="table-wrap"><table class="simple-table" style="min-width:540px"><thead><tr><th>נהג</th><th>מצב</th><th>תוקף</th><th>פעולה</th></tr></thead><tbody>${secRows}</tbody></table></div>
      <p class="note">בגרסה אמיתית רק גורם ביטחון מורשה (קב״ט) יראה את הפעולה הזו.</p>
    </section>
  </div>`;
}

/* ---------- Render ---------- */
function render(){
  renderTabs();
  const views = {driver:renderDriver, guard:renderGuard, manager:renderManager, admin:renderAdmin};
  $('app').innerHTML = views[ui.tab]();
  if (ui.tab === 'driver' && ui.dview === 'qr') drawQr();
  $('soundBtn').innerHTML = icon(ui.sound ? 'sound' : 'mute',16) + `<span class="lbl">${ui.sound ? 'צליל פועל' : 'צליל כבוי'}</span>`;
}

/* ---------- Events ---------- */
const val = id => ($(id)?.value || '').trim();
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) { if (ev.target.id === 'modal') closeModal(); return; }
  const act = el.dataset.act, id = Number(el.dataset.id), k = el.dataset.k;
  switch (act){
    case 'tab': ui.tab = k; closeModal(); break;
    case 'nav': ui.dview = k; break;
    case 'login': ui.currentId = Number(val('loginUser')); ui.dview = 'home'; break;
    case 'logout': ui.currentId = null; ui.dview = 'login'; break;
    case 'go-register': ui.dview = 'register'; break;
    case 'go-login': ui.dview = 'login'; break;
    case 'home': ui.dview = 'home'; break;
    case 'certs': ui.dview = 'certs'; break;
    case 'register': {
      const name = val('rName'), tz = val('rTz'), company = val('rCompany'), phone = val('rPhone'), user = val('rUser');
      if (!name || !company || !user) return toast('נא למלא שם, חברה ושם משתמש');
      if (!/^\d{9}$/.test(tz)) return toast('תעודת זהות חייבת להכיל 9 ספרות');
      if (state.drivers.some(x => x.tz === tz)) return toast('תעודת הזהות כבר קיימת במערכת');
      const M = () => ({status:'missing',expiry:null,number:null,img:null,pending:null});
      const dr = {id:state.nextId++, name, tz, company, phone:phone||'—', user, approved:false, inside:false, last:null, notes:[], certs:{security:M(),height:M(),hazmat:M()}};
      state.drivers.push(dr); ui.currentId = dr.id; ui.dview = 'home';
      toast('הבקשה נשלחה למנהל המערכת');
      break;
    }
    case 'go-qr': newQr(); ui.dview = 'qr'; break;
    case 'sim-scan': ui.result = scan(ui.currentId, 'QR'); ui.dview = 'result'; break;
    case 'go-upload': ui.uploadKey = UPLOADABLE.includes(k) ? k : 'height'; ui.uploadImg = null; ui.dview = 'upload'; break;
    case 'upload': {
      const dr = cur(), key = val('uType'), number = val('uNum'), expiry = val('uExp');
      if (!number) return toast('נא להזין מספר אישור');
      if (!expiry || daysTo(expiry) < 1) return toast('תאריך התוקף חייב להיות עתידי');
      dr.certs[key].pending = {expiry, number, img:ui.uploadImg, at:new Date()};
      ui.uploadImg = null; ui.dview = 'certs';
      toast('האישור נשלח לבדיקת מנהל המסוף');
      break;
    }
    case 'dismiss-note': cur().notes.splice(Number(el.dataset.i), 1); break;
    case 'filter': ui.filter = k; break;
    case 'open-driver': driverModal(id); return;
    case 'add-driver': addDriverModal(); return;
    case 'add-driver-save': {
      const name = val('aName'), tz = val('aTz'), company = val('aCompany'), phone = val('aPhone');
      if (!name || !company) return toast('נא למלא שם וחברה');
      if (!/^\d{9}$/.test(tz)) return toast('תעודת זהות חייבת להכיל 9 ספרות');
      if (state.drivers.some(x => x.tz === tz)) return toast('תעודת הזהות כבר קיימת במערכת');
      const M = () => ({status:'missing',expiry:null,number:null,img:null,pending:null});
      state.drivers.push({id:state.nextId++, name, tz, company, phone:phone||'—', user:'driver'+tz.slice(-4), approved:false, inside:false, last:null, notes:[], certs:{security:M(),height:M(),hazmat:M()}});
      closeModal(); toast('הנהג נוסף ומחכה לאישור מנהל מערכת');
      break;
    }
    case 'scan-unknown': scanUnknown(); break;
    case 'manual': scan(id, 'ידני'); closeModal(); toast('נרשם ביומן'); break;
    case 'close': closeModal(); return;
    case 'zoom': window.open('about:blank').document.write(`<img src="${el.src}" style="max-width:100%">`); return;
    case 'approve-doc': {
      const dr = byId(id), c = dr.certs[k], p = c.pending, expiry = val(`exp-${id}-${k}`);
      if (!expiry || daysTo(expiry) < 0) return toast('תאריך תוקף לא תקין');
      dr.certs[k] = {status:'valid', expiry, number:p.number, img:p.img, pending:null};
      toast(`${CERTS[k]} של ${dr.name} אושר`);
      break;
    }
    case 'reject-doc': {
      const dr = byId(id), reason = val(`rsn-${id}-${k}`) || 'המסמך לא תקין';
      dr.certs[k].pending = null;
      dr.notes.push(`${CERTS[k]} נדחה ע״י מנהל המסוף: ${reason}`);
      toast('המסמך נדחה והנהג קיבל הודעה');
      break;
    }
    case 'approve-reg': byId(id).approved = true; toast('הרישום אושר'); break;
    case 'reject-reg': state.drivers = state.drivers.filter(x => x.id !== id); toast('הבקשה נדחתה'); break;
    case 'grant-sec': {
      const expiry = val(`sec-${id}`);
      if (!expiry || daysTo(expiry) < 1) return toast('תאריך התוקף חייב להיות עתידי');
      byId(id).certs.security = {status:'valid', expiry, number:'SEC-'+String(Math.floor(1000+Math.random()*9000)), img:null, pending:null};
      toast('האישור הביטחוני עודכן');
      break;
    }
    default: return;
  }
  render();
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'guardSearch'){ ui.q = ev.target.value; $('guardRows').innerHTML = guardRows(); }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'uType') ui.uploadKey = ev.target.value;
  if (ev.target.id === 'uFile'){
    const f = ev.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { ui.uploadImg = r.result; const p = $('uPrev'); p.src = r.result; p.classList.remove('hidden'); };
    r.readAsDataURL(f);
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeModal(); });
$('brandMark').innerHTML = brandMark(22);
$('brandName').innerHTML = brandWord();
$('brandTag').textContent = BRAND.tagline;
document.title = BRAND.name.join('') + ' · ' + BRAND.tagline;
$('resetBtn').innerHTML = icon('reset',16) + '<span class="lbl">איפוס הדגמה</span>';
$('soundBtn').addEventListener('click', () => { ui.sound = !ui.sound; render(); });
$('resetBtn').addEventListener('click', () => { state = seed(); resetUi(); closeModal(); render(); toast('ההדגמה אופסה'); });

render();
</script>
</body>
</html>
